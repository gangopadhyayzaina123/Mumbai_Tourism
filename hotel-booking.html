<!DOCTYPE html>
<html>

<head>
    <title>Hotel Booking - Mumbai Tourism</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <h1>Hotel Booking</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="heritage.html">Heritage</a>
            <a href="hotel-booking.html">Hotel Booking</a>
            <a href="gallery.html">Gallery</a>
        </nav>

    </header>


    <main>

        <section class="heritage-intro">

            <p class="page-label">
                PLAN YOUR VISIT • STAY IN MUMBAI
            </p>

            <h2>Hotel Booking</h2>

            <p>
                Fill in the form below to provide the details required
                for your hotel stay during your visit to Mumbai.
            </p>

        </section>


        <form>


            <h3>Personal Information</h3>


            <label for="name">
                Full Name:
            </label>

            <br>

            <input type="text"
                   id="name"
                   name="name"
                   placeholder="Enter your full name"
                   required>

            <br><br>


            <label for="email">
                Email Address:
            </label>

            <br>

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

            <br><br>


            <label for="phone">
                Phone Number:
            </label>

            <br>

            <input type="tel"
                   id="phone"
                   name="phone"
                   placeholder="Enter your phone number"
                   required>

            <br><br>


            <label for="guests">
                Number of Guests:
            </label>

            <br>

            <input type="number"
                   id="guests"
                   name="guests"
                   min="1"
                   max="20"
                   required>

            <br><br>


            <h3>Stay Details</h3>


            <label for="checkin">
                Check-in Date:
            </label>

            <br>

            <input type="date"
                   id="checkin"
                   name="checkin"
                   required>

            <br><br>


            <label for="checkout">
                Check-out Date:
            </label>

            <br>

            <input type="date"
                   id="checkout"
                   name="checkout"
                   required>

            <br><br>


            <label for="room">
                Room Type:
            </label>

            <br>

            <select id="room"
                    name="room"
                    required>

                <option value="">
                    -- Select Room Type --
                </option>

                <option value="single">
                    Single Room
                </option>

                <option value="double">
                    Double Room
                </option>

                <option value="deluxe">
                    Deluxe Room
                </option>

                <option value="suite">
                    Suite
                </option>

            </select>

            <br><br>


            <h3>Meal Preference</h3>


            <input type="radio"
                   id="breakfast"
                   name="meal"
                   value="breakfast">

            <label for="breakfast">
                Breakfast
            </label>


            <input type="radio"
                   id="half-board"
                   name="meal"
                   value="half-board">

            <label for="half-board">
                Breakfast and Dinner
            </label>


            <input type="radio"
                   id="none"
                   name="meal"
                   value="none">

            <label for="none">
                No Meal
            </label>


            <br><br>


            <label for="requests">
                Special Requests:
            </label>

            <br>

            <textarea id="requests"
                      name="requests"
                      rows="5"
                      placeholder="Enter any special requests"></textarea>


            <br><br>


            <input type="checkbox"
                   id="terms"
                   name="terms"
                   required>

            <label for="terms">
                I confirm that the information provided is correct.
            </label>


            <br><br>


            <input type="submit"
                   value="Book Hotel">

            <input type="reset"
                   value="Clear Form">


        </form>

    </main>

</body>

</html>
